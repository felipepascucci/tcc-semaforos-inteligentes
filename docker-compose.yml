# Serviços do TCC — context/02 §3.
#
# Fora do compose, por rodarem no host (precisam de USB e de display):
#   sim/     -> binário do SUMO, e sumo-gui para gravar a demonstração
#   bridge/  -> acesso a COM3 (Windows) / /dev/ttyUSB0 (Linux)
# Ver README, seção "Rodar sim/ e bridge/ no host".

name: tcc-semaforos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: ${POSTGRES_DB:-semaforo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `backend` só sobe depois que isto passa (depends_on: service_healthy).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcc} -d ${POSTGRES_DB:-semaforo}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Serviço de vida curta: cria o schema e aplica os seeds, depois sai. O
  # `backend` só sobe quando ele termina com sucesso, então `docker compose up`
  # entrega um sistema utilizável a partir de um clone limpo — que é o que a
  # Definition of Done do CLAUDE.md pede.
  #
  # Ambas as operações são idempotentes: subir de novo não duplica nada.
  #
  # NOTA sobre context/02 §6 ("usuário da aplicação sem privilégio de DDL;
  # migrations com usuário separado"): aqui os dois são o mesmo usuário `tcc`.
  # É uma simplificação consciente de ambiente de desenvolvimento, decidida em
  # 2026-08-25 e registrada em context/09. Num ambiente real, este serviço usaria
  # credencial própria com DDL e o backend continuaria sem.
  migracoes:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-senha}@db:5432/${POSTGRES_DB:-semaforo}
    volumes:
      - ./backend:/app/backend
      - ./db:/app/db
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "alembic upgrade head && python -m db.seeds.carregar"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Sobrescreve o DATABASE_URL do `.env` (que aponta para `localhost`, a
      # perspectiva de quem roda no host). Aqui dentro o banco atende pelo nome
      # do serviço, `db`, que só existe na rede do Docker.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-senha}@db:5432/${POSTGRES_DB:-semaforo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PERFIL_PARAMETROS: ${PERFIL_PARAMETROS:-simulacao}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # A ponte da bancada roda no HOST (precisa da USB). O backend lê
      # GET /estado dela a 5 Hz (decisão de 2026-10-05, Bloco 6). Ponte fora do
      # ar não impede o backend de subir: o /health mostra `ponte: falha`.
      # Vazio desliga a leitura.
      PONTE_URL: ${PONTE_URL_CONTEINER-http://host.docker.internal:8001}
      # Login do operador do dashboard (context/02 §6, Bloco 7). Os padrões são
      # SÓ de desenvolvimento (senha `operador`), para um clone limpo subir com
      # `docker compose up`; o .env sobrescreve. Trocar antes da apresentação.
      OPERADOR_USUARIO: ${OPERADOR_USUARIO:-operador}
      OPERADOR_SENHA_HASH: ${OPERADOR_SENHA_HASH:-pbkdf2_sha256:600000:65awAm2aT0qAXsGu_kbctw:YZXX7T2N8xDCvCnxMoPilTWOxpKrnItbJ9k4mWoq56E}
      JWT_SEGREDO: ${JWT_SEGREDO:-dev-somente-local-troque-antes-da-apresentacao}
    # No Docker Desktop (Windows/Mac) o nome já existe; no Linux, isto o cria.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Recarga a quente em desenvolvimento. O pacote é instalado em modo
      # editável no Dockerfile, então o mount aponta para o mesmo caminho.
      - ./backend:/app/backend
      # Cenários e seeds reservadas, que validam POST /simulacoes.
      - ./sim/config:/app/sim/config:ro
    depends_on:
      db:
        condition: service_healthy
      migracoes:
        condition: service_completed_successfully
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  adminer:
    image: adminer:5
    profiles: ["dev"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Dashboard (Bloco 7): o build estático do Vite servido pelo nginx, em HTTPS
  # com certificado autoassinado, e proxy reverso de /api (REST e WebSocket)
  # para o backend — context/02 §3 e §6. https://localhost:8443
  #
  # Para desenvolver o frontend com recarga a quente, `npm run dev` no host
  # (http://localhost:5173), que repassa /api ao backend da porta 8000.
  frontend:
    build:
      context: ./frontend
    ports:
      - "${DASHBOARD_PORT:-8443}:443"
    volumes:
      # O certificado gerado na primeira subida, para o navegador não pedir
      # exceção nova a cada `up`.
      - certificados:/etc/nginx/certs
    depends_on:
      # O nginx resolve `backend` ao subir; sem ele de pé, não sobe.
      backend:
        condition: service_healthy

volumes:
  pgdata:
  certificados:
