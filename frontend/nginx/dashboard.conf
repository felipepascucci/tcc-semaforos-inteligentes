# nginx do dashboard — context/02 §6 (Bloco 7).
#
# HTTPS com certificado autoassinado, o build estático do Vite e o proxy reverso
# para o backend do compose. O navegador só fala TLS com o nginx; do nginx ao
# backend é HTTP dentro da rede do Docker.

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/certificado.pem;
    ssl_certificate_key /etc/nginx/certs/chave.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # WebSocket do stream (wss:// do lado do navegador). Sem timeout longo, o
    # nginx derruba a conexão ociosa em 60 s, e a bancada parada fica sem ST.
    location = /api/v1/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # O Swagger do backend também pelo HTTPS.
    location = /docs         { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    # Os arquivos do build têm hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer outro caminho é o index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
