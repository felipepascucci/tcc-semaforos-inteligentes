# Perfil HARDWARE (bancada) — sobreposição sobre parametros.yaml.
#
# Só as chaves que mudam aparecem aqui; as demais são herdadas do perfil de
# simulação. Ativado por PERFIL_PARAMETROS=hardware.
#
# Origem: arquitetura da bancada adotada em 2026-10-05 (context/05 §3,
# context/09). Quem aplica estes valores na bancada é o firmware do UNO, que
# decide sozinho; aqui eles servem de referência ao dublê
# (adapters/hardware/simulado.py) e ao roteiro de aceitação (bridge/verificar.py).
#
# O ciclo tem 2 fases — eixo principal (S1+S2) e eixo transversal (S3+S4) — e a
# emergência abre o verde EXCLUSIVO da aproximação do VE.

# --- Tempos do ciclo da bancada ---------------------------------------------
verde_s: 3.0        # duração do verde de cada fase no ciclo
verde_min_s: 3.0    # piso de I4 — coincide com verde_s na bancada
amarelo_s: 2.0
all_red_s: 1.0

# Consequência de verde_s == verde_min_s: na bancada a emergência NUNCA trunca
# um verde — aguarda o corrente completar 3 s.
#
#   Ciclo completo (2 fases)                 : 2 x (3 + 2 + 1) = 12 s
#   Da chegada do VE ao verde dele, pior caso :     3 + 2 + 1  =  6 s

# --- Teto da emergência — context/05 §3.4, item 7 ----------------------------
# Emergência contínua (renovações e fila incluídas) nunca passa disto. Substitui o
# watchdog na garantia de I6 (redefinido em 2026-10-05) e cumpre I5 na bancada.
preempcao_timeout_s: 30.0

# --- Fases do ciclo da bancada ---------------------------------------------
n_fases_prototipo: 2

# --- Verde do VE, por tipo — a regra do sketch da equipe de hardware ---------
# A ordem de prioridade entre os tipos é herdada de `prioridade_tipo`
# (AMBULANCIA > BOMBEIRO > POLICIA), a mesma do sketch.
verde_por_tipo_s:
  AMBULANCIA: 9.0
  BOMBEIRO: 8.0
  POLICIA: 7.0
