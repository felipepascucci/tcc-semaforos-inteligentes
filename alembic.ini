# Alembic — migrations do banco (context/03).
#
# Fica na raiz para que `alembic upgrade head` funcione sem `-c`, mas os scripts
# de migration vivem em `db/migrations/`, conforme a estrutura do CLAUDE.md.
#
# A URL do banco NÃO é configurada aqui: `db/migrations/env.py` a lê do ambiente
# (ALEMBIC_DATABASE_URL > DATABASE_URL_HOST > DATABASE_URL), carregando o `.env`
# da raiz. Deixar credencial em arquivo versionado é o erro que o context/02 §6
# manda evitar.

[alembic]
script_location = db/migrations
prepend_sys_path = backend
path_separator = os

# Migrations recebem prefixo temporal, para que a ordem no diretório seja a
# ordem cronológica — em trabalho a três mãos isso evita confusão na revisão.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Sem post_write_hooks de propósito: o hook exigiria `ruff` no PATH do sistema
# (não basta estar no venv) e um caminho fixo quebraria para quem trabalha em
# outro sistema operacional. A formatação das migrations sai no portão normal —
# `ruff format .` — junto com o resto do código.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
