# Seeds — dados mínimos para o sistema subir funcional (context/03 §5).
#
# ─────────────────────────────────────────────────────────────────────────────
# O QUE AQUI É PROVISÓRIO, E POR QUÊ
#
# Nada neste arquivo é resultado experimental. São cadastros — o equivalente ao
# "quais cruzamentos existem", não "quanto tempo o VE levou". A distinção
# importa: `context/08` §4.2 proíbe gerar dado sintético que **pareça**
# resultado, e nenhum número daqui aparece no capítulo 5.
#
# Ainda assim, três campos são explicitamente PROVISÓRIOS até o Bloco 3, quando
# a malha SUMO passa a existir e vira a fonte da verdade:
#
#   1. latitude/longitude dos 8 TLS — derivadas da geometria declarada do
#      cenário (grade 2x4, ~500 m entre cruzamentos), não de levantamento de
#      campo. Servem para o mapa do dashboard ter onde desenhar.
#   2. tempo_ciclo dos 8 TLS — ver comentário no bloco `malha_sumo`.
#   3. As FASES dos 8 TLS não são semeadas aqui de propósito. Elas vêm do
#      `.net.xml` e do `sim/config/mapa_fases.yaml` (Bloco 3). Inventá-las agora
#      criaria um cadastro que conflitaria com a rede real.
#
# O cruzamento do protótipo (`PROTO_CRUZ_01`) NÃO é provisório: os tempos vêm da
# decisão P13 e do perfil de bancada fechado em 2026-08-24.
# ─────────────────────────────────────────────────────────────────────────────

malha_sumo:
  # Grade 2x4: duas vias arteriais (linhas) cruzando quatro transversais
  # (colunas), ~500 m entre cruzamentos consecutivos — a geometria do Bloco 3.1.
  #
  # A origem é um ponto na zona arterial de São Paulo, escolhido só para que as
  # coordenadas caiam sobre a cidade no mapa Leaflet. Não corresponde a um
  # cruzamento real, e o texto do TCC não deve afirmar que corresponde.
  origem: { latitude: -23.55000000, longitude: -46.63000000 }
  linhas: 2
  colunas: 4
  espacamento_m: 500

  # PROVISÓRIO. Ciclo de 70 s = 2 fases x (30 s verde + 3 s amarelo + 2 s
  # all-red), usando amarelo_s e all_red_s de `parametros.yaml`. O verde de 30 s
  # é um valor de partida plausível para via arterial, NÃO uma calibração: a
  # calibração real depende da demanda dos cenários, que por sua vez depende de
  # P11 (fonte dos dados de fluxo) estar resolvida. Substituir no Bloco 3.
  tempo_ciclo_provisorio_s: 70
  prefixo_codigo: CRUZ

prototipo:
  # UM cruzamento com quatro aproximações, em split phasing (decisão P13).
  # A versão anterior de context/03 §5 pedia quatro semáforos PROTO_S1..S4;
  # isso modelava cada módulo como um cruzamento independente e foi corrigido.
  # S1..S4 seguem existindo como nomes de aproximação no firmware e no
  # protocolo serial — não como chaves de `semaforo`.
  semaforo:
    codigo_externo: PROTO_CRUZ_01
    descricao: Protótipo físico — cruzamento de 4 aproximações (split phasing)
    # A bancada não fica em lugar nenhum do mapa. A coordenada existe só para o
    # marcador do dashboard, e está deslocada ~1 km ao sul da grade de propósito:
    # na origem, o marcador do protótipo cairia exatamente sobre o de CRUZ_01 e
    # os dois ficariam empilhados.
    latitude: -23.55898000
    longitude: -46.64000000
    tempo_ciclo: 24 # 4 x (3 verde + 2 amarelo + 1 all-red) — perfil de bancada
  # duracao_base e verde_min vêm de parametros.hardware.yaml (verde_s = 3,0 s).
  # verde_max é 30 s = preempcao_timeout_s da bancada: durante a preempção o
  # verde pode ser estendido, mas nunca além do timeout do firmware.
  fase_padrao:
    duracao_base_s: 3
    verde_min_s: 3
    verde_max_s: 30
  fases:
    - { indice_fase: 1, descricao: "Principal — Sentido A", movimentos: [PRINCIPAL_A], modulo: S1 }
    - { indice_fase: 2, descricao: "Principal — Sentido B", movimentos: [PRINCIPAL_B], modulo: S2 }
    - { indice_fase: 3, descricao: "Transversal — Sentido A", movimentos: [TRANSVERSAL_A], modulo: S3 }
    - { indice_fase: 4, descricao: "Transversal — Sentido B", movimentos: [TRANSVERSAL_B], modulo: S4 }

veiculos:
  # Placas fictícias no padrão Mercosul (LLLNLNN). Não pertencem a veículo real.
  - { placa: AMB1A01, tipo: AMBULANCIA, identificacao: SAMU 192 — Unidade 07 }
  - { placa: BMB2B02, tipo: BOMBEIRO, identificacao: Corpo de Bombeiros — ABT 12 }
  - { placa: POL3C03, tipo: POLICIA, identificacao: Polícia Militar — Viatura 45 }

tags:
  # PLACEHOLDER até a leitura real do RC522 (entrega 5.8).
  #
  # `ativo: false` não é detalhe: enquanto o UID for placeholder, ele NÃO pode
  # autorizar preempção. Uma tag placeholder ativa é uma credencial válida
  # conhecida por qualquer um que leia o repositório.
  - { uid: PLACEHOLDER01, placa: AMB1A01, ativo: false }
  - { uid: PLACEHOLDER02, placa: BMB2B02, ativo: false }

dispositivos:
  # token_dev é SOMENTE para desenvolvimento e é hasheado (SHA-256) antes de ir
  # para o banco — a coluna guarda `token_hash`, nunca o token.
  # Sobrescreva por ambiente: TOKEN_LEITOR_CRUZ_01 / TOKEN_CTRL_PROTO_01.
  # TROCAR antes da apresentação (context/02 §6).
  - codigo: LEITOR_CRUZ_01
    tipo: LEITOR_RFID
    semaforo: PROTO_CRUZ_01
    token_dev: dev-somente-local-leitor
  - codigo: CTRL_PROTO_01
    tipo: CONTROLADOR_SEMAFORO
    semaforo: PROTO_CRUZ_01
    token_dev: dev-somente-local-controlador
